<html lang="en">
<head>
<meta charset="utf-8">

     browser storage: refreshing resets the sample. -->

<title>Cap Quote Prototype — DEMO</title>
<style>
:root {
  --brand:#103B56; --brand-mid:#1A5A7A; --brand-lite:#E8F1F6;
  --accent:#2196A0; --accent-lite:#E3F4F5; --green:#27AE60; --red:#C0392B;
  --text:#1A2A35; --muted:#5B7888; --border:#DDE6EC; --bg:#FFFFFF; --surface:#F4F8FB;
  --success-bg:#D1FAE5; --success-text:#065F46;
  --warning-bg:#FEF3C7; --warning-text:#92400E;

  --info-bg:#E8F1F6; --info-text:#1A5A7A;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(16,59,86,0.06); --shadow-md:0 4px 16px rgba(16,59,86,0.12);
  --tap:48px; --demo-red:#8E2626;

}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; font:17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--text); background:var(--surface); }
button, input, select, textarea { font:inherit; color:inherit; }
h1,h2,h3 { margin:0; line-height:1.25; }
[hidden] { display:none !important; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---- Compact, persistent demo strip ---- */
.top { position:sticky; top:0; z-index:30; }
.demo-strip { background:var(--demo-red); color:#fff; display:flex; align-items:center; gap:10px;
  padding:4px max(12px, env(safe-area-inset-right)) 4px max(12px, env(safe-area-inset-left)); padding-top:calc(4px + env(safe-area-inset-top)); min-height:40px; }
.demo-strip strong { font-size:14px; letter-spacing:.05em; white-space:nowrap; }
.demo-strip .demo-sub { font-size:13px; opacity:.95; flex:1; min-width:0; }
.menu-wrap { position:relative; }
.btn-strip { min-height:36px; padding:0 12px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,.75); background:transparent; color:#fff; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; }
.btn-strip[aria-expanded="true"] { background:rgba(255,255,255,.2); }
.popover { position:absolute; right:0; top:calc(100% + 6px); min-width:240px; background:#fff; color:var(--text); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-md); padding:6px; z-index:40; }
.popover button { display:flex; width:100%; min-height:var(--tap); align-items:center; gap:10px; padding:0 14px; border:0; background:none; border-radius:var(--radius-sm); text-align:left; cursor:pointer; font-size:16px; }
.popover button:hover, .popover button:focus-visible { background:var(--brand-lite); }
.popover .danger { color:var(--danger-text); }
.popover hr { border:0; border-top:1px solid var(--border); margin:4px 0; }

/* ---- Header + step navigation ---- */
.app-head { background:var(--brand); color:#fff; padding:8px 16px 0; }
.app-head .titles { max-width:1180px; margin:0 auto; display:flex; gap:4px 12px; align-items:baseline; flex-wrap:wrap; }
.app-head h1 { font-size:17px; font-weight:700; }
.app-head .company { opacity:.8; font-size:14px; }
.tabs { max-width:1180px; margin:8px auto 0; display:flex; gap:4px; }
.step-tab { flex:1 1 0; min-width:0; min-height:var(--tap); display:flex; align-items:center; gap:6px; padding:6px 8px; border:0; border-radius:var(--radius-md) var(--radius-md) 0 0;
  background:rgba(255,255,255,.10); color:#fff; cursor:pointer; text-align:left; font-size:14px; line-height:1.2; }
.step-tab[aria-current="step"] { background:var(--surface); color:var(--brand); font-weight:700; }
.step-num { display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.2); font-weight:700; font-size:14px; flex:none; }
.step-tab[aria-current="step"] .step-num { background:var(--brand); color:#fff; }
.step-tab .flag { margin-left:auto; flex:none; font-size:12px; font-weight:700; padding:1px 6px; border-radius:999px; }
.step-tab > span:nth-child(2) { min-width:0; }
.flag.ok { background:var(--success-bg); color:var(--success-text); }
.flag.bad { background:var(--warning-bg); color:var(--warning-text); }
.compact-nav { display:none; max-width:1180px; margin:6px auto 0; padding-bottom:10px; }
.compact-row { display:flex; align-items:center; gap:10px; }
.compact-row .now { flex:1; font-weight:700; font-size:17px; }
.compact-row .now small { display:block; font-weight:400; font-size:13px; opacity:.85; }
.btn-steps { min-height:44px; padding:0 14px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,.75); background:transparent; color:#fff; font-weight:600; cursor:pointer; }
.progress { display:flex; gap:4px; margin-top:8px; }
.progress span { flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.25); }
.progress span.done { background:#7FD1E8; }
.progress span.cur { background:#fff; }
.progress span.bad { background:#F5C26B; }
#steps-menu { right:0; left:auto; width:min(360px, calc(100vw - 32px)); }
#steps-menu button[aria-current="step"] { font-weight:700; background:var(--brand-lite); }
#steps-menu .flag { margin-left:auto; }
@media (max-width: 1000px) { .tabs { display:none; } .compact-nav { display:block; } }

/* ---- Main ---- */
main { max-width:1180px; margin:0 auto; padding:18px 16px 120px; }
.step-title { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px; margin-bottom:12px; }
.step-title h2 { font-size:25px; color:var(--brand); }
.step-title h2:focus { outline:none; }
.step-title .hint { color:var(--muted); font-size:16px; }
.card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:18px; margin-bottom:14px; }
.card h3 { font-size:19px; color:var(--brand); margin-bottom:12px; }
.card-head { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-bottom:12px; }
.card-head h3 { margin:0; flex:1 1 auto; }
.grid { display:grid; gap:14px; }
.g2 { grid-template-columns:repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns:repeat(4, minmax(0,1fr)); }
.span2 { grid-column:span 2; }
.two-col { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; align-items:start; }
@media (max-width: 900px) { .two-col { grid-template-columns:1fr; } .g4 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width: 700px) { .g3 { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width: 480px) { .g2, .g3, .g4 { grid-template-columns:1fr; } .span2 { grid-column:auto; } body { font-size:16px; } }

.field label, .field .label { display:block; font-weight:600; font-size:15px; margin-bottom:6px; }
.opt { font-weight:400; color:var(--muted); }
.input { width:100%; min-height:var(--tap); padding:10px 12px; border:1.5px solid #B9CBD6; border-radius:var(--radius-sm); background:#fff; font-size:17px; }
textarea.input { min-height:80px; resize:vertical; }
.input:focus { outline:3px solid rgba(33,150,160,.35); border-color:var(--accent); }
.input[aria-invalid="true"] { border-color:var(--red); background:#FFF8F7; }
.static { display:flex; align-items:center; min-height:var(--tap); padding:10px 12px; border-radius:var(--radius-sm); background:var(--surface); color:var(--muted); }
.with-unit, .with-prefix { display:flex; align-items:stretch; }
.with-unit .input { border-top-right-radius:0; border-bottom-right-radius:0; }
.with-unit .unit { display:grid; place-items:center; padding:0 12px; border:1.5px solid #B9CBD6; border-left:0; border-radius:0 var(--radius-sm) var(--radius-sm) 0; background:var(--surface); color:var(--muted); font-weight:600; min-width:48px; }
.with-prefix .pre { display:grid; place-items:center; padding:0 10px; border:1.5px solid #B9CBD6; border-right:0; border-radius:var(--radius-sm) 0 0 var(--radius-sm); background:var(--surface); color:var(--muted); font-weight:600; }
.with-prefix .input { border-top-left-radius:0; border-bottom-left-radius:0; }
.err { color:var(--danger-text); font-size:14px; font-weight:600; margin-top:5px; }
.err:empty { display:none; }
.help { color:var(--muted); font-size:14px; margin-top:5px; }

.btn { min-height:var(--tap); padding:0 18px; border-radius:var(--radius-sm); border:1.5px solid var(--brand); background:#fff; color:var(--brand); font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn:active { transform:translateY(1px); }
.btn.primary { background:var(--brand); color:#fff; }
.btn.danger { border-color:var(--red); color:var(--danger-text); }
.btn.quiet { border-color:var(--border); color:var(--brand-mid); font-weight:600; }
.btn[disabled] { opacity:.45; cursor:not-allowed; }
.btn.small { min-height:44px; padding:0 12px; font-size:15px; }
.row-actions { display:flex; flex-wrap:wrap; gap:8px; }

.seg { display:flex; flex-wrap:wrap; gap:8px; }
.seg button { min-height:var(--tap); min-width:64px; padding:0 16px; border-radius:var(--radius-sm); border:1.5px solid #B9CBD6; background:#fff; cursor:pointer; font-weight:600; }
.seg button[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:#fff; }
.seg.invalid button { border-color:var(--red); }

.check { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1.5px solid #B9CBD6; border-radius:var(--radius-md); background:#fff; cursor:pointer; min-height:var(--tap); }
.check input { width:28px; height:28px; margin:0; flex:none; accent-color:var(--green); }
.check.on { border-color:var(--green); background:var(--success-bg); }
.check.invalid { border-color:var(--red); }

.notice { display:flex; gap:10px; align-items:flex-start; border-radius:var(--radius-md); padding:10px 14px; margin-bottom:12px; font-size:15px; border:1px solid transparent; }
.notice::before { content:"i"; flex:none; display:grid; place-items:center; width:22px; height:22px; border-radius:50%; font-weight:800; font-size:13px; font-style:italic; margin-top:1px; }
.notice.warn { background:var(--warning-bg); color:var(--warning-text); border-color:#F5D58A; }
.notice.warn::before { content:"!"; font-style:normal; background:var(--warning-text); color:var(--warning-bg); }
.notice.info { background:var(--info-bg); color:var(--info-text); border-color:#C7DCE8; }
.notice.info::before { background:var(--info-text); color:#fff; }
.notice.bad { background:var(--danger-bg); color:var(--danger-text); border-color:#F6B7B0; }
.notice.bad::before { content:"!"; font-style:normal; background:var(--danger-text); color:#fff; }
.notice.good { background:var(--success-bg); color:var(--success-text); border-color:#9FDDBF; }
.notice.good::before { content:"✓"; font-style:normal; background:var(--success-text); color:#fff; }
.notice .body { flex:1; }
.pill { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; vertical-align:middle; }
.pill.sample { background:var(--warning-bg); color:var(--warning-text); }
.pill.pending { background:var(--info-bg); color:var(--info-text); }
.ref { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; color:var(--muted); font-weight:400; }

.line-card { border-left:6px solid var(--accent); }
.line-card.collapsed { padding:14px 18px; }
.sum { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
.sum .name { font-weight:700; font-size:18px; color:var(--brand); }
.sum .facts { flex:1 1 360px; color:var(--text); font-size:15px; }
.sum .ok { color:var(--success-text); font-weight:700; font-size:14px; }
.line-meta { color:var(--muted); font-size:15px; }
.money { font-variant-numeric:tabular-nums; }
.line-total { font-size:20px; font-weight:800; color:var(--brand); text-align:right; }
.totals { max-width:460px; margin-left:auto; }
.totals .t-row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); }
.totals .t-row.grand { font-size:22px; font-weight:800; color:var(--brand); border-bottom:0; }
.totals .muted { color:var(--muted); font-size:14px; }

.guide { margin-bottom:14px; }
.guide summary { cursor:pointer; min-height:var(--tap); display:flex; align-items:center; font-weight:700; color:var(--brand); }
.guide .figure { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
.guide svg { width:100%; max-width:340px; height:auto; }
.guide .cap { font-size:14px; color:var(--warning-text); background:var(--warning-bg); border-radius:var(--radius-sm); padding:8px 10px; font-weight:600; }

.issue-list { list-style:none; margin:4px 0 0; padding:0; }
.issue-list li { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:8px 0; border-top:1px solid rgba(0,0,0,.08); }
.issue-list li:first-child { border-top:0; }
.issue-list .txt { flex:1 1 260px; }
.review-dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:0; }
.review-dl dt { color:var(--muted); font-weight:600; }
.review-dl dd { margin:0; }
.review-line { border-top:1px solid var(--border); padding:12px 0; }
.review-line:first-of-type { border-top:0; }
.choice-tile { border:1.5px dashed #9DB4C2; border-radius:var(--radius-md); padding:12px; background:var(--surface); color:var(--muted); }
.choice-tile b { color:var(--text); }

/* ---- Bottom action bar ---- */
.actionbar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(255,255,255,.97); border-top:1px solid var(--border); box-shadow:0 -2px 10px rgba(16,59,86,.08);
  padding:10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.actionbar .inner { max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:12px; }
.actionbar .where { flex:1; text-align:center; color:var(--muted); font-size:15px; }
.actionbar .btn { min-width:120px; min-height:52px; }
@media (max-width: 600px) { .actionbar .where .long { display:none; } .actionbar .btn { min-width:96px; }
  .demo-strip { flex-wrap:wrap; row-gap:0; } .demo-strip strong { flex:1; } .demo-strip .demo-sub { order:3; flex-basis:100%; font-size:12px; padding-bottom:2px; } }

/* ---- Modal ---- */
.modal-back { position:fixed; inset:0; z-index:50; background:rgba(16,30,40,.5); display:grid; place-items:center; padding:16px; }
.modal { background:#fff; border-radius:var(--radius-lg); box-shadow:0 10px 40px rgba(0,0,0,.3); width:min(720px, 100%); max-height:calc(100vh - 32px); display:flex; flex-direction:column; }
.modal header { padding:16px 18px; border-bottom:1px solid var(--border); }
.modal header h2 { font-size:21px; color:var(--brand); }
.modal .body { padding:16px 18px; overflow:auto; }
.modal .body h3 { font-size:17px; color:var(--brand); margin:16px 0 6px; }
.modal .body ul { margin:0; padding-left:20px; }
.modal .body li { margin:4px 0; }
.modal footer { padding:12px 18px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
.cat-row { display:grid; grid-template-columns:1.2fr 2fr 1fr auto auto; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
.cat-row.head { font-weight:700; font-size:14px; color:var(--muted); }
@media (max-width: 640px) { .cat-row { grid-template-columns:1fr 1fr; } .cat-row.head { display:none; } }
.cat-row label.mini { display:flex; align-items:center; gap:6px; font-size:14px; }
.cat-row label.mini input { width:24px; height:24px; }
.table-wrap { overflow-x:auto; }

/* ---- Quote document ---- */
.preview-tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
.quote-doc { background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-md); padding:32px; position:relative; overflow:hidden; font-size:15px; }
.quote-doc .wm { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
.quote-doc .wm span { transform:rotate(-28deg); font-size:110px; font-weight:900; color:rgba(180,40,40,.07); letter-spacing:.08em; white-space:nowrap; }
.doc-demo { border:2px solid var(--demo-red); color:var(--demo-red); background:#FFF1F1; font-weight:800; text-align:center; padding:8px; border-radius:6px; letter-spacing:.05em; margin-bottom:20px; }
.doc-head { display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; border-bottom:3px solid var(--brand); padding-bottom:14px; margin-bottom:18px; }
.doc-head .co { font-size:26px; font-weight:800; color:var(--brand); }
.doc-head .meta { text-align:right; color:var(--muted); }
.doc-head .meta b { color:var(--text); font-size:20px; }
.doc-parties { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.doc-parties h4, .doc-sec h4 { margin:0 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.doc-table { width:100%; border-collapse:collapse; margin-bottom:16px; }
.doc-table th { text-align:left; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); border-bottom:2px solid var(--border); padding:8px 6px; }
.doc-table td { border-bottom:1px solid var(--border); padding:10px 6px; vertical-align:top; }
.doc-table .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.doc-table .spec { color:var(--muted); font-size:14px; margin-top:3px; }
.doc-sec { margin-top:18px; padding-top:12px; border-top:1px solid var(--border); }
.doc-foot { margin-top:24px; font-size:13px; color:var(--muted); text-align:center; }
.print-only { display:none; }
@media (max-width: 600px) { .quote-doc { padding:16px; } .doc-parties { grid-template-columns:1fr; } .quote-doc .wm span { font-size:60px; } }

/* ---- Print: the quote document only, with the full demo warning repeated ---- */
@media print {
  @page { margin:16mm 14mm 18mm; }
  body { background:#fff; font-size:12pt; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .top, .actionbar, .preview-tools, .step-title, .screen-only, .modal-back, .popover { display:none !important; }
  main { padding:0; max-width:none; }
  .quote-doc { border:0; box-shadow:none; padding:0; overflow:visible; }
  .quote-doc .wm { position:fixed; }
  .print-only { display:block; }
  .print-demo-foot { position:fixed; bottom:0; left:0; right:0; text-align:center; font-size:9pt; font-weight:800; color:var(--demo-red); letter-spacing:.05em; }
  .doc-table tr, .totals, .doc-sec { break-inside:avoid; }
  body:not(.on-preview) main > * { display:none !important; }
  body:not(.on-preview) main::before { content:"DEMO — NOT FOR CUSTOMER USE. Open step 6 (Quote preview) to print the sample quote."; display:block; font-weight:800; color:var(--demo-red); }
}
</style>
</head>
<body>

<div class="top">
  <div class="demo-strip" role="region" aria-label="Demo notice">
    <strong>DEMO — NOT FOR CUSTOMER USE</strong>
    <span class="demo-sub">Fictional sample · changes aren’t saved</span>
    <div class="menu-wrap">
      <button class="btn-strip" type="button" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="demo-menu">Menu ▾</button>
      <div class="popover" id="demo-menu" role="menu" aria-label="Demo menu" hidden>
        <button type="button" role="menuitem" data-act="about">About this demo</button>
        <button type="button" role="menuitem" data-act="settings">Demo settings</button>
        <hr>
        <button type="button" role="menuitem" class="danger" data-act="reset">Reset sample…</button>
      </div>
    </div>
  </div>
  <header class="app-head">
    <div class="titles"><h1>Cap Quote</h1><span class="company" id="hdr-company"></span></div>
    <nav class="tabs" id="tabs" aria-label="Quote steps"></nav>
    <nav class="compact-nav" aria-label="Quote progress">
      <div class="compact-row">
        <div class="now" id="compact-now" aria-live="polite"></div>
        <div class="menu-wrap">
          <button class="btn-steps" type="button" id="steps-btn" aria-haspopup="true" aria-expanded="false" aria-controls="steps-menu">All steps ▾</button>
          <div class="popover" id="steps-menu" role="menu" aria-label="Go to step" hidden></div>
        </div>
      </div>
      <div class="progress" id="progress" aria-hidden="true"></div>
    </nav>
  </header>
</div>

<main id="main"></main>

<div class="actionbar">
  <div class="inner">
    <button class="btn" type="button" id="btn-back" data-act="back">‹ Back</button>
    <span class="where" id="where"></span>
    <button class="btn primary" type="button" id="btn-next" data-act="next">Next ›</button>
  </div>
</div>

<div id="modal-root"></div>

<script>
'use strict';
/* Cap-quote prototype. All data is fictional and lives only in `state`; nothing is persisted or transmitted. */

const STEPS = [
  { key: 'customer', label: 'Customer & property', short: 'Customer' },
  { key: 'measure',  label: 'Measurements',        short: 'Measurements' },
  { key: 'pricing',  label: 'Products & pricing',  short: 'Pricing' },
  { key: 'contract', label: 'Contract & deposit',  short: 'Contract & deposit' },
  { key: 'review',   label: 'Review',              short: 'Review' },
  { key: 'preview',  label: 'Quote preview',       short: 'Preview' },
];
const S = { CUSTOMER: 0, MEASURE: 1, PRICING: 2, CONTRACT: 3, REVIEW: 4, PREVIEW: 5 };
const UNIT_WARNING = 'Changing units does not convert the numbers. Review and re-enter measurements.';

// Configurable demo settings (Menu → Demo settings). Every value is a fictional placeholder.
function defaultSettings() {
  return {
    companyName: 'Sample Chimney Co.',
    units: ['in', 'cm'],
    defaultUnit: 'in',
    depositExamplePercent: '20',
    materials: ['Stainless steel', 'Galvanized steel', 'Copper'],
    finishes: ['Mill / unpainted', 'Black powder coat', 'Bronze powder coat'],
    // `measured` = the line needs measurements.
    catalog: [
      { pn: 'DEMO-CAP-SF',   description: 'Single-flue chimney cap',       price: '189.00', measured: true },
      { pn: 'DEMO-CAP-MF',   description: 'Multi-flue chimney cap',        price: '349.00', measured: true },
      { pn: 'DEMO-CHASE',    description: 'Chase cover',                   price: '425.00', measured: true },
      { pn: 'DEMO-INSTALL',  description: 'Cap installation labor',        price: '150.00', measured: false },
      { pn: 'DEMO-HAULAWAY', description: 'Old cap removal and haul-away', price: '45.00',  measured: false },
    ],
  };
}

function blankMeasurements(unit) {
  // review: '' | 'product' | 'units' | 'edited' — why a confirmation was cleared
  return { width: '', length: '', height: '', units: unit, material: '', finish: '', notes: '', checked: false, review: '', reviewFrom: '' };
}

function freshState() {
  const s = {
    settings: defaultSettings(),
    step: 0, visited: { 0: true }, shown: {}, touched: {},
    nextLineNo: 1, quoteNo: 'DEMO-Q-0001',
    customer: { name: 'Jordan Sample', phone: '(555) 010-0123', email: 'jordan.sample@example.com' },
    property: { street: '123 Example Avenue', city: 'Cincinnati', state: 'OH', zip: '45202', lat: '39.1031', lng: '-84.5120' },
    lines: [],
    deposit: { required: '', amount: '', collected: 'no' },
  };
  // Preloaded: the SAME product twice as separate lines with independent measurements
  // (the second not yet confirmed, so Review shows a flag), plus a labor line.
  const a = addLine(s, 'DEMO-CAP-SF');
  Object.assign(a, { label: 'Front flue', collapsed: true });
  Object.assign(a.m, { width: '13', length: '13', height: '10', material: 'Stainless steel', finish: 'Black powder coat', notes: 'Clay tile flue.', checked: true });
  const b = addLine(s, 'DEMO-CAP-SF');
  b.label = 'Rear flue';
  Object.assign(b.m, { width: '9', length: '13', height: '8', material: 'Stainless steel', finish: 'Mill / unpainted', notes: 'Re-measure height.' });
  addLine(s, 'DEMO-INSTALL');
  return s;
}

function addLine(s, pn) {
  const id = 'QL-' + String(s.nextLineNo++).padStart(3, '0');  // stable; never reused after removal
  const line = { id, label: '', pn: '', description: '', catalogPrice: '', unitPrice: '', qty: '1', discountType: 'amount', discountValue: '',
                 measured: false, collapsed: false, addedOn: '', m: blankMeasurements(s.settings.defaultUnit) };
  s.lines.push(line);
  if (pn) applyProduct(s, line, pn);
  return line;
}

// Choosing a part number fills description and price. Changing an existing line's product keeps its ID and any
// measurements already typed, but clears "Measurements checked" so they must be reviewed for the new product.
function applyProduct(s, line, pn) {
  const prev = line.pn;
  const item = s.settings.catalog.find(c => c.pn === pn);
  line.pn = pn || '';
  if (!item) { line.description = ''; line.catalogPrice = ''; line.unitPrice = ''; line.measured = false; }
  else {
    line.description = item.description;
    line.catalogPrice = item.price;
    line.unitPrice = item.price;
    line.measured = !!item.measured;
  }
  if (prev && prev !== line.pn) {
    line.m.checked = false;
    line.m.review = 'product';
    line.m.reviewFrom = prev;
    line.collapsed = false;
  }
}

let state = freshState();

/* ---------------- helpers ---------------- */
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const cssq = v => CSS.escape(v);

function parseMoney(str) {   // integer cents; accepts "1,234.50" or "$1234.5"
  const t = String(str == null ? '' : str).replace(/[$,\s]/g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return NaN;
  return Math.round(parseFloat(t) * 100);
}
function fmt(cents) {
  if (!Number.isFinite(cents)) return '—';
  const neg = cents < 0; const v = Math.abs(cents);
  return (neg ? '−' : '') + '$' + Math.floor(v / 100).toLocaleString('en-US') + '.' + String(v % 100).padStart(2, '0');
}
function parsePositive(str) {
  const t = String(str == null ? '' : str).trim();
  if (!/^\d*\.?\d+$/.test(t)) return NaN;
  const n = parseFloat(t); return n > 0 ? n : NaN;
}
function parseQty(str) { const t = String(str == null ? '' : str).trim(); return /^\d+$/.test(t) && +t > 0 && +t <= 999 ? +t : NaN; }
function businessDate(d) { return new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: 'long', day: 'numeric' }).format(d); }
function trimNum(v) { const n = parseFloat(v); return Number.isFinite(n) ? String(+n.toFixed(3)) : String(v); }
function getLine(id) { return state.lines.find(l => l.id === id); }
const isCapLine = l => l.measured || (!l.pn && l.addedOn === 'measure');

// Friendly name, e.g. "Cap 1 — Front flue". The stable ID (QL-001) is shown separately as a reference.
function lineName(l) {
  if (isCapLine(l)) {
    const n = state.lines.filter(isCapLine).indexOf(l) + 1;
    return 'Cap ' + n + (l.label.trim() ? ' — ' + l.label.trim() : '');
  }
  return l.description || 'New line';
}
function productText(pn) { const c = state.settings.catalog.find(x => x.pn === pn); return c ? `${c.pn} — ${c.description}` : pn; }

/* ---------------- calculations ---------------- */
function lineCalc(line) {
  const qty = parseQty(line.qty), unit = parseMoney(line.unitPrice);
  const gross = Number.isFinite(qty) && Number.isFinite(unit) ? qty * unit : NaN;
  let disc = 0, discErr = '';
  const dv = String(line.discountValue).trim();
  if (dv !== '') {
    if (line.discountType === 'percent') {
      const p = parseFloat(dv);
      if (!/^\d*\.?\d+$/.test(dv) || !(p >= 0 && p <= 100)) { disc = NaN; discErr = 'Enter a percent from 0 to 100.'; }
      else disc = Number.isFinite(gross) ? Math.round(gross * p / 100) : NaN;
    } else {
      disc = parseMoney(dv);
      if (!Number.isFinite(disc)) discErr = 'Enter a dollar amount, e.g. 25.00';
      else if (Number.isFinite(gross) && disc > gross) discErr = 'Discount cannot exceed the line amount (' + fmt(gross) + ').';
    }
  }
  const net = Number.isFinite(gross) && Number.isFinite(disc) && !discErr ? gross - disc : NaN;
  return { qty, unit, gross, disc: discErr ? NaN : disc, net, discErr };
}
function totals() {
  let sub = 0, disc = 0, ok = true;
  for (const l of state.lines) { const c = lineCalc(l); if (!Number.isFinite(c.net)) { ok = false; continue; } sub += c.gross; disc += c.disc; }
  return { sub, disc, total: sub - disc, ok: ok && state.lines.length > 0 };
}

/* ---------------- validation ----------------
   { fields: {path: message}, issues: [{step, sev, msg, path, line}] }. 'error' blocks the preview; 'warn' lists a demo placeholder. */
function validate() {
  const fields = {}; const issues = [];
  const err = (step, path, msg, label, line) => { fields[path] = msg; issues.push({ step, sev: 'error', path, line, label, bare: msg, msg: label ? label + ': ' + msg : msg }); };
  const warn = (step, msg, path) => issues.push({ step, sev: 'warn', msg, path });
  const c = state.customer, p = state.property;

  if (!c.name.trim()) err(S.CUSTOMER, 'customer.name', 'Enter the customer name.', 'Customer');
  if (c.email.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email.trim())) err(S.CUSTOMER, 'customer.email', 'Enter a valid email or leave it blank.', 'Customer');
  if (!p.street.trim()) err(S.CUSTOMER, 'property.street', 'Enter the street address.', 'Property');
  if (!p.city.trim()) err(S.CUSTOMER, 'property.city', 'Enter the city.', 'Property');
  if (!/^[A-Za-z]{2}$/.test(p.state.trim())) err(S.CUSTOMER, 'property.state', 'Use a 2-letter state, e.g. OH.', 'Property');
  if (!/^\d{5}(-\d{4})?$/.test(p.zip.trim())) err(S.CUSTOMER, 'property.zip', 'Use a 5-digit ZIP (or ZIP+4).', 'Property');
  const lat = parseFloat(p.lat), lng = parseFloat(p.lng);
  if (!/^-?\d+(\.\d+)?$/.test(p.lat.trim()) || !(lat >= -90 && lat <= 90)) err(S.CUSTOMER, 'property.lat', 'Latitude must be between −90 and 90.', 'Property');
  if (!/^-?\d+(\.\d+)?$/.test(p.lng.trim()) || !(lng >= -180 && lng <= 180)) err(S.CUSTOMER, 'property.lng', 'Longitude must be between −180 and 180.', 'Property');
  warn(S.CUSTOMER, 'Coordinates are sample data, not a verified lookup.', 'property.lat');

  if (!state.lines.length) issues.push({ step: S.PRICING, sev: 'error', msg: 'Add at least one product line.', path: '' });
  for (const l of state.lines) {
    const tag = `${lineName(l)} (${l.id})`, base = 'lines.' + l.id + '.';
    if (!l.pn) { err(l.addedOn === 'measure' ? S.MEASURE : S.PRICING, base + 'pn', 'Choose a part number.', tag, l.id); continue; }
    if (l.measured) {
      const m = l.m;
      for (const k of ['width', 'length', 'height']) {
        if (!Number.isFinite(parsePositive(m[k]))) err(S.MEASURE, base + 'm.' + k, (m[k] === '' ? 'Enter the ' : 'Enter a positive number for ') + k + '.', tag, l.id);
      }
      if (!state.settings.units.includes(m.units)) err(S.MEASURE, base + 'm.units', 'Choose units.', tag, l.id);
      if (!m.material) err(S.MEASURE, base + 'm.material', 'Choose a material.', tag, l.id);
      if (!m.finish) err(S.MEASURE, base + 'm.finish', 'Choose a finish.', tag, l.id);
      if (!m.checked) {
        const why = m.review === 'product' ? 'Product changed — review measurements, then confirm “Measurements checked”.'
                  : m.review === 'units' ? 'Units changed — review measurements, then confirm “Measurements checked”.'
                  : 'Confirm “Measurements checked”.';
        err(S.MEASURE, base + 'm.checked', why, tag, l.id);
      }
    }
    const lc = lineCalc(l);
    if (!Number.isFinite(lc.qty)) err(S.PRICING, base + 'qty', 'Quantity must be a whole number from 1 to 999.', tag, l.id);
    if (!Number.isFinite(lc.unit)) err(S.PRICING, base + 'unitPrice', 'Enter a price, e.g. 189.00', tag, l.id);
    else if (lc.unit === 0) err(S.PRICING, base + 'unitPrice', 'Price is $0.00 — unfinished placeholder.', tag, l.id);
    if (lc.discErr) err(S.PRICING, base + 'discountValue', lc.discErr, tag, l.id);
  }
  if (state.lines.length) warn(S.PRICING, 'All prices are fictional placeholders pending Sean’s pricing rules.', '');

  const d = state.deposit, t = totals();
  if (d.required === '') err(S.CONTRACT, 'deposit.required', 'Choose whether a deposit is required.', 'Deposit');
  if (d.required === 'yes') {
    const amt = parseMoney(d.amount);
    if (String(d.amount).trim() === '') err(S.CONTRACT, 'deposit.amount', 'Enter the deposit amount.', 'Deposit');
    else if (!Number.isFinite(amt) || amt <= 0) err(S.CONTRACT, 'deposit.amount', 'Enter an amount greater than $0.00.', 'Deposit');
    else if (t.ok && amt > t.total) err(S.CONTRACT, 'deposit.amount', 'Deposit cannot exceed the quote total (' + fmt(t.total) + ').', 'Deposit');
  }
  warn(S.CONTRACT, 'Contract terms are a placeholder; signing (iPad or email) is pending Sean’s choice.', '');
  return { fields, issues };
}
const lineMeasureErrors = id => Object.keys(V.fields).filter(k => k.startsWith('lines.' + id + '.m.') || k === 'lines.' + id + '.pn');

/* ---------------- state binding ---------------- */
function setPath(path, value) {
  const parts = path.split('.');
  if (parts[0] === 'lines') {
    const line = getLine(parts[1]); if (!line) return;
    if (parts[2] === 'm') {
      const k = parts[3], m = line.m;
      if (k === 'units') {
        if (m.units !== value) { m.checked = false; m.review = 'units'; line.collapsed = false; }   // numbers are NOT converted
      } else if (['width', 'length', 'height', 'material', 'finish'].includes(k) && m[k] !== value && m.checked) {
        m.checked = false; m.review = 'edited';
      }
      m[k] = value;
      if (k === 'checked' && value) { m.review = ''; m.reviewFrom = ''; }
    } else line[parts[2]] = value;
    return;
  }
  let o = state; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
}

/* ---------------- rendering ---------------- */
let V = validate();
function stepOfPath(path) {
  if (path.startsWith('customer') || path.startsWith('property')) return S.CUSTOMER;
  if (path.startsWith('deposit')) return S.CONTRACT;
  if (/^lines\.[^.]+\.m\./.test(path)) return S.MEASURE;
  const pm = /^lines\.([^.]+)\.pn$/.exec(path); if (pm && (getLine(pm[1]) || {}).addedOn === 'measure') return S.MEASURE;
  return S.PRICING;
}
// A message shows once its field was touched or its step was left/reviewed.
const showErr = path => (state.touched[path] || state.shown[stepOfPath(path)]) ? (V.fields[path] || '') : '';
const inv = path => showErr(path) ? 'true' : 'false';
const errEl = path => `<div class="err" data-err="${esc(path)}" id="err-${esc(path)}">${esc(showErr(path))}</div>`;
const notice = (kind, html, attrs = '') => `<div class="notice ${kind}" ${attrs}><div class="body">${html}</div></div>`;

function field(path, label, value, opts = {}) {
  const id = 'f-' + path;
  const input = `<input class="input" id="${esc(id)}" data-path="${esc(path)}" value="${esc(value)}" type="text" ${opts.inputmode ? `inputmode="${opts.inputmode}"` : ''}
     autocomplete="off" ${opts.maxlength ? `maxlength="${opts.maxlength}"` : ''} ${opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : ''}
     aria-invalid="${inv(path)}" aria-describedby="err-${esc(path)}">`;
  let control = input;
  if (opts.unit) control = `<div class="with-unit">${input}<span class="unit" data-unit-for="${esc(opts.unitFor || '')}">${esc(opts.unit)}</span></div>`;
  if (opts.prefix) control = `<div class="with-prefix"><span class="pre">${esc(opts.prefix)}</span>${input}</div>`;
  return `<div class="field ${opts.cls || ''}"><label for="${esc(id)}">${label}${opts.optional ? ' <span class="opt">(optional)</span>' : ''}</label>${control}${opts.help ? `<div class="help">${opts.help}</div>` : ''}${errEl(path)}</div>`;
}
function seg(path, label, options, current, extra = '') {
  return `<div class="field"><span class="label" id="lbl-${esc(path)}">${label}</span>
    <div class="seg ${showErr(path) ? 'invalid' : ''}" role="group" aria-labelledby="lbl-${esc(path)}">
      ${options.map(o => `<button type="button" data-seg="${esc(path)}" data-val="${esc(o.v)}" aria-pressed="${o.v === current}">${esc(o.t)}</button>`).join('')}
    </div>${extra}${errEl(path)}</div>`;
}
function productSelect(line, measuredOnly) {
  const items = state.settings.catalog.filter(c => !measuredOnly || c.measured);
  const path = 'lines.' + line.id + '.pn';
  const known = state.settings.catalog.some(c => c.pn === line.pn);
  return `<div class="field"><label for="f-${esc(path)}">Product (part number)</label>
    <select class="input" id="f-${esc(path)}" data-path="${esc(path)}" data-product="${esc(line.id)}" aria-invalid="${inv(path)}" aria-describedby="err-${esc(path)}">
      <option value="">Choose a product…</option>
      ${!known && line.pn ? `<option value="${esc(line.pn)}" selected>${esc(line.pn)} — ${esc(line.description)} (no longer in demo catalog)</option>` : ''}
      ${items.map(c => `<option value="${esc(c.pn)}" ${c.pn === line.pn ? 'selected' : ''}>${esc(c.pn)} — ${esc(c.description)} — ${fmt(parseMoney(c.price))}</option>`).join('')}
    </select>${errEl(path)}</div>`;
}
function dims(l) { return ['width', 'length', 'height'].map(k => l.m[k] === '' ? '?' : trimNum(l.m[k])).join(' × ') + ' ' + l.m.units; }
function measureSummary(l) { return [`W × L × H: ${dims(l)}`, l.m.material, l.m.finish].filter(Boolean).join(' · '); }
function reviewNote(l) {
  const m = l.m;
  if (m.checked || !m.review) return '';
  if (m.review === 'product') return `Product changed from ${esc(productText(m.reviewFrom))} to ${esc(productText(l.pn) || 'no product')}. The numbers below were kept — review them for the new product, then confirm again.`;
  if (m.review === 'units') return esc(UNIT_WARNING);
  return 'A measurement changed after it was checked — please check again.';
}

function navStatus(i) {
  const bad = V.issues.filter(x => x.sev === 'error' && x.step === i).length;
  if (i > S.CONTRACT || !state.visited[i]) return { bad, flag: '' };
  return { bad, flag: bad ? `<span class="flag bad" title="${bad} to fix"><span aria-hidden="true">!${bad}</span><span class="sr-only">, ${bad} to fix</span></span>`
                         : '<span class="flag ok" title="Complete"><span aria-hidden="true">✓</span><span class="sr-only">, complete</span></span>' };
}
function renderNav() {
  $('#tabs').innerHTML = STEPS.map((s, i) => `<button type="button" class="step-tab" data-goto="${i}" ${i === state.step ? 'aria-current="step"' : ''}>
      <span class="step-num">${i + 1}</span><span>${esc(s.short)}</span>${navStatus(i).flag}</button>`).join('');
  $('#compact-now').innerHTML = `Step ${state.step + 1} of ${STEPS.length} — ${esc(STEPS[state.step].label)}`;
  $('#progress').innerHTML = STEPS.map((s, i) => `<span class="${i === state.step ? 'cur' : navStatus(i).bad && state.visited[i] && i <= S.CONTRACT ? 'bad' : state.visited[i] ? 'done' : ''}"></span>`).join('');
  $('#steps-menu').innerHTML = STEPS.map((s, i) => `<button type="button" role="menuitem" data-goto="${i}" ${i === state.step ? 'aria-current="step"' : ''}>
      <span class="step-num" style="background:var(--brand-lite);color:var(--brand)">${i + 1}</span>${esc(s.label)}${navStatus(i).flag}</button>`).join('');
}

function stepTitle(hint) { return `<div class="step-title"><h2 tabindex="-1" id="step-heading">${esc(STEPS[state.step].label)}</h2>${hint ? `<span class="hint">${hint}</span>` : ''}</div>`; }

function capCard(l) {

      ${seg(b + 'm.finish', 'Finish', s.finishes.map(v => ({ v, t: v })).concat(m.finish && !s.finishes.includes(m.finish) ? [{ v: m.finish, t: m.finish + ' (removed)' }] : []), m.finish)}

function lineBreakdown(c) {
  if (!Number.isFinite(c.gross)) return 'Fix quantity / price';
  return `${c.qty} × ${fmt(c.unit)} = ${fmt(c.gross)}` + (Number.isFinite(c.disc) && c.disc ? `<br>Discount −${fmt(c.disc)}` : '');
}
function totalsBlock(t, tax = 'not calculated in demo') {

}

function issuesPanel(list, compact) {
  const warns = list.filter(i => i.sev === 'warn'), errors = [];
  for (const i of list.filter(x => x.sev === 'error')) {   // one row per line and step, e.g. "Cap 3 (QL-004): Enter the width. Enter the length."
    const g = i.line && errors.find(e => e.line === i.line && e.step === i.step);
    if (g) { g.msg += ' ' + i.bare; g.count++; } else errors.push({ ...i, count: 1 });
  }
  const total = errors.reduce((n, e) => n + e.count, 0);
  const item = i => `<li><span class="txt">${esc(i.msg)}</span><button type="button" class="btn small quiet" data-goto="${i.step}" data-focus-path="${esc(i.path || '')}" data-focus-line="${esc(i.line || '')}">Fix in ${esc(STEPS[i.step].label)}</button></li>`;
  return `${errors.length ? notice('bad', `<b>${total} item(s) to finish before the quote preview</b><ul class="issue-list">${errors.map(item).join('')}</ul>`, 'data-issues="errors"')
                          : notice('good', '<b>Ready for preview.</b> Everything required is filled in.', 'data-issues="errors"')}
    ${!compact && warns.length ? notice('warn', `<b>Demo placeholders (not blocking)</b><ul class="issue-list">${warns.map(i => `<li><span class="txt">${esc(i.msg)}</span></li>`).join('')}</ul>`, 'data-issues="warns"') : ''}`;
}

      <dt>Coordinates</dt><dd>${esc(p.lat)}, ${esc(p.lng)} <span class="pill sample">Sample, unverified</span></dd></dl></section>

  <section class="card"><div class="card-head"><h3>Products (${state.lines.length})</h3>${ed(1, 'Edit measurements')}${ed(2, 'Edit pricing')}</div>${lines || '<div class="line-meta">No lines.</div>'}</section>
  <div class="two-col">
    <section class="card"><div class="card-head"><h3>Contract &amp; deposit</h3>${ed(3)}</div>

const RENDER = [renderCustomer, renderMeasure, renderPricing, renderContract, renderReview, renderPreview];
const NEXT_LABEL = ['Next ›', 'Next ›', 'Next ›', 'Review ›', 'Generate preview ›'];
function render(opts = {}) {
  V = validate();
  const y = window.scrollY;
  $('#main').innerHTML = RENDER[state.step]();
  document.body.classList.toggle('on-preview', state.step === S.PREVIEW);
  $('#hdr-company').textContent = state.settings.companyName + ' · sample';
  renderNav();
  $('#btn-back').disabled = state.step === 0;
  $('#btn-next').hidden = state.step === S.PREVIEW;
  $('#btn-next').textContent = NEXT_LABEL[state.step] || '';
  $('#where').innerHTML = `Step ${state.step + 1} of ${STEPS.length}<span class="long"> — ${esc(STEPS[state.step].label)}</span>`;
  window.scrollTo(0, opts.top ? 0 : y);
}

// After typing: refresh messages and figures without re-rendering (keeps focus and the on-screen keyboard).
function refreshDerived() {
  V = validate();
  $$('[data-err]').forEach(el => {
    const msg = showErr(el.dataset.err); el.textContent = msg;
    const input = document.getElementById('f-' + el.dataset.err); if (input) input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  });
  for (const l of state.lines) {
    const c = lineCalc(l);
    const g = $(`[data-calc="gross:${cssq(l.id)}"]`); if (g) g.innerHTML = lineBreakdown(c);
    const n = $(`[data-calc="net:${cssq(l.id)}"]`); if (n) n.textContent = fmt(c.net);
    const e = $(`[data-edited="${cssq(l.id)}"]`);
    if (e) e.innerHTML = editedHtml(l, Number.isFinite(c.unit) && c.unit !== parseMoney(l.catalogPrice));
    $$(`[data-name="${cssq(l.id)}"]`).forEach(x => { x.textContent = lineName(l); });
    const wrap = $(`[data-check-wrap="${cssq(l.id)}"]`);
    if (wrap) {
      wrap.querySelector('input').checked = l.m.checked;
      wrap.classList.toggle('on', l.m.checked); wrap.classList.toggle('invalid', !!showErr('lines.' + l.id + '.m.checked'));
      const rn = $(`[data-review-note="${cssq(l.id)}"]`); const note = reviewNote(l);
      if (rn) rn.innerHTML = note ? notice(l.m.review === 'edited' ? 'info' : 'warn', note) : '';
    }
    const cb = $(`[data-collapse-btn="${cssq(l.id)}"]`); if (cb) cb.disabled = !(l.pn && !lineMeasureErrors(l.id).length);
  }
  const t = totals();
  $$('[data-calc="totals"]').forEach(el => { el.outerHTML = totalsBlock(t); });
  const gr = $('[data-calc="grand"]'); if (gr) gr.textContent = t.ok ? fmt(t.total) : '—';
  const ex = $('[data-calc="deposit-example"]');
  if (ex) { const pct = parseFloat(state.settings.depositExamplePercent); ex.textContent = fmt(t.ok && pct > 0 && pct <= 100 ? Math.round(t.total * pct / 100) : NaN); }
  renderNav();
}

function goTo(step, focus = {}) {
  closeMenus(false);
  state.shown[state.step] = true;   // leaving a step reveals its validation messages
  state.step = Math.max(0, Math.min(STEPS.length - 1, step));
  state.visited[state.step] = true;
  if (state.step >= S.REVIEW) for (let i = 0; i <= S.CONTRACT; i++) { state.visited[i] = true; state.shown[i] = true; }
  if (focus.line) { const l = getLine(focus.line); if (l && lineMeasureErrors(l.id).length) l.collapsed = false; }
  render({ top: true });
  let target = null;
  if (focus.path) target = document.getElementById('f-' + focus.path) || $(`[data-seg="${cssq(focus.path)}"]`) || $(`[data-path="${cssq(focus.path)}"]`);
  if (!target && focus.line) target = $(`[data-line="${cssq(focus.line)}"]`);
  if (target) {
    target.scrollIntoView({ block: 'center' });
    if (target.matches('input, select, textarea, button')) target.focus({ preventScroll: true });
    else { const f = target.querySelector('select, input, button'); if (f) f.focus({ preventScroll: true }); }
  } else { const h = $('#step-heading'); if (h) h.focus({ preventScroll: true }); }
}

/* ---------------- menus ---------------- */
function openMenu(btn, menu) {
  closeMenus(false);
  menu.hidden = false; btn.setAttribute('aria-expanded', 'true');
  const first = menu.querySelector('[aria-current="step"]') || menu.querySelector('button'); if (first) first.focus();
}
function closeMenus(returnFocus) {
  for (const [b, m] of [['#menu-btn', '#demo-menu'], ['#steps-btn', '#steps-menu']]) {
    const menu = $(m), btn = $(b);
    if (!menu.hidden) { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (returnFocus) btn.focus(); }
  }
}
function menuKeys(e) {
  const menu = e.target.closest('[role="menu"]'); if (!menu) return false;
  const items = $$('button', menu), i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { items[(i + 1) % items.length].focus(); e.preventDefault(); return true; }
  if (e.key === 'ArrowUp') { items[(i - 1 + items.length) % items.length].focus(); e.preventDefault(); return true; }
  if (e.key === 'Tab') { closeMenus(false); return false; }
  return false;
}

/* ---------------- modal ---------------- */
let modalOpener = null;
function openModal({ title, body, actions }) {
  const active = document.activeElement;   // a menu item disappears with its menu, so return focus to the menu button
  modalOpener = active && active.closest('#demo-menu') ? $('#menu-btn') : active && active.closest('#steps-menu') ? $('#steps-btn') : active;
  closeMenus(false);
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><h2 id="modal-title">${esc(title)}</h2></header><div class="body">${body}</div>
    <footer>${actions.map((a, i) => `<button type="button" class="btn ${a.cls || ''}" data-modal-act="${i}">${esc(a.label)}</button>`).join('')}</footer></div></div>`;
  root.onclick = e => {
    const b = e.target.closest('[data-modal-act]');
    if (b) { const a = actions[+b.dataset.modalAct]; if (!a.run || a.run() !== false) closeModal(); }
    else if (e.target.classList.contains('modal-back')) closeModal();
  };
  const first = root.querySelector('.modal .body input, .modal footer .btn'); if (first) first.focus();
}
function closeModal() {
  $('#modal-root').innerHTML = '';
  if (modalOpener && document.contains(modalOpener)) modalOpener.focus();
  else { const h = $('#step-heading'); if (h) h.focus({ preventScroll: true }); }
  modalOpener = null;
}
function trapTab(e) {
  const modal = $('#modal-root .modal'); if (!modal || e.key !== 'Tab') return;
  const f = $$('button, input, select, textarea, [href]', modal).filter(x => !x.disabled && x.offsetParent);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); e.preventDefault(); }
}

function openAbout() {
  openModal({
    title: 'About this demo',
    body: `<p><b>A clickable sample of a chimney-cap quote flow, for review only.</b> It is not a finished product and must not be used with customers.</p>
      <h3>What is simulated</h3><ul>
        <li>Customer, address, coordinates, part numbers and prices are fictional.</li>
        <li>Measurement fields and the illustration are provisional, pending the approved cap sheet. They are not a fabrication specification and do not guarantee fit.</li>
        <li>No measurement-based pricing formula and no tax calculation.</li>
        <li>The contract section has no legal terms. There is no signature capture.</li>
        <li>“Deposit collected” is a status typed in by hand. No payment is taken, processed or verified.</li>
        <li>There is no Send button: nothing is emailed or sent.</li></ul>
      <h3>Your changes</h3><ul>
        <li>Everything stays in this browser tab. Nothing is saved, synced or sent.</li>
        <li>Refreshing the page, or Menu → Reset sample, restores the original sample.</li>
        <li>The page is blocked from contacting any other website or system.</li></ul>
      <h3>In the finished module (planned, not built)</h3><ul>
        <li>Customer, property and quote data would live in GHL. Properties would need a clean service address and verified coordinates saved when created.</li>
        <li>Contracts and signatures would use GHL Documents &amp; Contracts; in-person iPad or emailed signing is still to be decided.</li>
        <li>Measurements per quote line are proposed as linked “Quote Line Specifications” records. This is a design recommendation, not yet proven.</li></ul>
      <h3>Feasibility notes so far</h3><ul>
        <li>A GHL test estimate kept repeated catalog products with separate line IDs after editing.</li>
        <li>Measurements survived only as description text; structured storage has not been proven.</li>
        <li>Customer-photo privacy is unresolved, so this demo has no photos.</li>
        <li>A test custom object copied between test accounts; that does not prove the whole module will.</li></ul>`,
    actions: [{ label: 'Close', cls: 'primary' }],
  });
}

function openSettings() {
  const s = state.settings;
  const catRow = (c, i) => `<div class="cat-row" data-cat-row="${i}">
      <input class="input" data-cat="pn" value="${esc(c.pn)}" aria-label="Part number">
      <input class="input" data-cat="description" value="${esc(c.description)}" aria-label="Description">
      <div class="with-prefix"><span class="pre">$</span><input class="input" data-cat="price" inputmode="decimal" value="${esc(c.price)}" aria-label="Price"></div>
      <label class="mini"><input type="checkbox" data-cat="measured" ${c.measured ? 'checked' : ''}> Needs measurements</label>
      <button type="button" class="btn small danger" data-cat-remove="${i}">Remove</button></div>`;
  openModal({
    title: 'Demo settings',
    body: `${notice('warn', 'All values are fictional placeholders. Changes last until the page is refreshed or the sample is reset.')}
      <div class="grid g2">
        <div class="field"><label for="set-company">Company name</label><input class="input" id="set-company" value="${esc(s.companyName)}"></div>
        <div class="field"><label for="set-pct">Example deposit %</label><input class="input" id="set-pct" inputmode="decimal" value="${esc(s.depositExamplePercent)}"><div class="help">Example only — not a company rule.</div></div>
        <div class="field"><label for="set-units">Units (comma-separated)</label><input class="input" id="set-units" value="${esc(s.units.join(', '))}"></div>
        <div class="field"><label for="set-defunit">Default unit for new caps</label><input class="input" id="set-defunit" value="${esc(s.defaultUnit)}"></div>
        <div class="field"><label for="set-mat">Materials (one per line)</label><textarea class="input" id="set-mat">${esc(s.materials.join('\n'))}</textarea></div>
        <div class="field"><label for="set-fin">Finishes (one per line)</label><textarea class="input" id="set-fin">${esc(s.finishes.join('\n'))}</textarea></div>
      </div>
      <h3>Demo catalog</h3>
      <div class="help" style="margin-bottom:6px">Changing a catalog price does not change lines already on the quote.</div>
      <div class="cat-row head"><span>Part number</span><span>Description</span><span>Price</span><span></span><span></span></div>
      <div id="cat-rows">${s.catalog.map(catRow).join('')}</div>
      <button type="button" class="btn small" id="cat-add" style="margin-top:10px">+ Add catalog item</button>
      <div class="err" id="set-err"></div>`,
    actions: [{ label: 'Cancel', cls: 'quiet' }, { label: 'Save settings', cls: 'primary', run: saveSettings }],
  });
  const rows = $('#cat-rows');
  $('#cat-add').onclick = () => rows.insertAdjacentHTML('beforeend', catRow({ pn: '', description: '', price: '', measured: true }, rows.children.length));
  rows.onclick = e => { const b = e.target.closest('[data-cat-remove]'); if (b) b.closest('.cat-row').remove(); };
}
function saveSettings() {
  const lines = v => [...new Set(v.split('\n').map(x => x.trim()).filter(Boolean))];
  const out = {
    companyName: $('#set-company').value.trim(),
    depositExamplePercent: $('#set-pct').value.trim(),
    units: [...new Set($('#set-units').value.split(/[\n,]/).map(x => x.trim()).filter(Boolean))],
    defaultUnit: $('#set-defunit').value.trim(),
    materials: lines($('#set-mat').value), finishes: lines($('#set-fin').value),
    catalog: $$('#cat-rows .cat-row').map(r => ({ pn: r.querySelector('[data-cat="pn"]').value.trim(), description: r.querySelector('[data-cat="description"]').value.trim(),
      price: r.querySelector('[data-cat="price"]').value.trim(), measured: r.querySelector('[data-cat="measured"]').checked })),
  };
  const problems = [];
  if (!out.companyName) problems.push('Enter a company name.');
  const pct = parseFloat(out.depositExamplePercent);
  if (!/^\d*\.?\d+$/.test(out.depositExamplePercent) || !(pct > 0 && pct <= 100)) problems.push('Example deposit % must be from 0 to 100.');
  if (!out.units.length) problems.push('Enter at least one unit.');
  if (!out.units.includes(out.defaultUnit)) problems.push('Default unit must be one of the units.');
  if (!out.materials.length || !out.finishes.length) problems.push('Enter at least one material and one finish.');
  if (!out.catalog.length) problems.push('Keep at least one catalog item.');
  const seen = new Set();
  out.catalog.forEach((c, i) => {
    if (!c.pn || !c.description) problems.push(`Catalog row ${i + 1}: part number and description are required.`);
    if (seen.has(c.pn)) problems.push(`Catalog row ${i + 1}: duplicate part number ${c.pn}.`); seen.add(c.pn);
    if (!Number.isFinite(parseMoney(c.price))) problems.push(`Catalog row ${i + 1}: enter a price such as 189.00.`);
    else c.price = (parseMoney(c.price) / 100).toFixed(2);
  });
  if (problems.length) { $('#set-err').innerHTML = problems.map(esc).join('<br>'); return false; }
  state.settings = out;
  render();
}

/* ---------------- events ---------------- */
document.addEventListener('input', e => {
  const el = e.target, path = el.dataset && el.dataset.path;
  if (!path || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  setPath(path, el.value); state.touched[path] = true;
  refreshDerived();
});
document.addEventListener('focusout', e => {
  const path = e.target.dataset && e.target.dataset.path;
  if (path && !state.touched[path]) { state.touched[path] = true; refreshDerived(); }
});
document.addEventListener('change', e => {
  const el = e.target, path = el.dataset && el.dataset.path; if (!path) return;
  if (el.dataset.product) {
    const line = getLine(el.dataset.product);
    applyProduct(state, line, el.value);
    state.touched[path] = true; state.touched['lines.' + line.id + '.m.checked'] = true;
    render();
    const again = document.getElementById('f-' + path); if (again) again.focus({ preventScroll: true });
    return;
  }
  if (el.type === 'checkbox') { setPath(path, el.checked); state.touched[path] = true; refreshDerived(); }
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('[data-guide]')) state.guideOpen = e.target.open; }, true);
document.addEventListener('click', e => {
  const segBtn = e.target.closest('[data-seg]');
  if (segBtn) {
    const path = segBtn.dataset.seg;
    setPath(path, segBtn.dataset.val); state.touched[path] = true;
    if (path.endsWith('discountType')) getLine(path.split('.')[1]).discountValue = '';
    render();
    const again = $(`[data-seg="${cssq(path)}"][data-val="${cssq(segBtn.dataset.val)}"]`); if (again) again.focus({ preventScroll: true });
    return;
  }
  if (e.target.closest('#menu-btn')) { $('#demo-menu').hidden ? openMenu($('#menu-btn'), $('#demo-menu')) : closeMenus(true); return; }
  if (e.target.closest('#steps-btn')) { $('#steps-menu').hidden ? openMenu($('#steps-btn'), $('#steps-menu')) : closeMenus(true); return; }
  if (!e.target.closest('.popover')) closeMenus(false);
  const go = e.target.closest('[data-goto]');
  if (go) { goTo(+go.dataset.goto, { line: go.dataset.focusLine, path: go.dataset.focusPath }); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, line = a.dataset.line && getLine(a.dataset.line);
  if (act === 'next') goTo(state.step + 1);
  else if (act === 'back') goTo(state.step - 1);
  else if (act === 'add-cap') { const l = addLine(state, ''); l.addedOn = 'measure'; render(); focusLine(l.id); }
  else if (act === 'add-line') { const l = addLine(state, ''); render(); focusLine(l.id); }
  else if (act === 'dup' && line) { const l = addLine(state, line.pn); if (state.step === S.MEASURE) l.addedOn = 'measure'; render(); focusLine(l.id); }
  else if (act === 'collapse' && line) { line.collapsed = true; render(); const b = $(`[data-act="expand"][data-line="${cssq(line.id)}"]`); if (b) b.focus({ preventScroll: true }); }
  else if (act === 'expand' && line) { line.collapsed = false; render(); focusLine(line.id); }
  else if (act === 'reset-price' && line) { line.unitPrice = line.catalogPrice; render(); }
  else if (act === 'fill-deposit') {
    const t = totals(), pct = parseFloat(state.settings.depositExamplePercent);
    if (t.ok && pct > 0 && pct <= 100) { state.deposit.amount = (Math.round(t.total * pct / 100) / 100).toFixed(2); state.touched['deposit.amount'] = true; render(); }
  }
  else if (act === 'remove' && line) {
    openModal({ title: `Remove ${lineName(line)}?`, body: `<p>${esc(line.pn || 'No product')} — ${esc(line.description || '')} <span class="ref">Ref ${esc(line.id)}</span></p><p>Its measurements and pricing are removed. Other lines keep their references.</p>`,
      actions: [{ label: 'Keep', cls: 'quiet' }, { label: 'Remove', cls: 'danger', run: () => { state.lines = state.lines.filter(l => l !== line); modalOpener = null; render(); } }] });
  }
  else if (act === 'reset') {
    openModal({ title: 'Reset the sample?', body: '<p>This clears every change and restores the original fictional sample, including demo settings. Nothing outside this page is affected.</p>',
      actions: [{ label: 'Cancel', cls: 'quiet' }, { label: 'Reset sample', cls: 'danger', run: () => { state = freshState(); modalOpener = null; render({ top: true }); } }] });
  }
  else if (act === 'about') openAbout();
  else if (act === 'settings') openSettings();
  else if (act === 'print') window.print();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#modal-root').innerHTML) { closeModal(); return; }
    closeMenus(true); return;
  }
  if (menuKeys(e)) return;
  trapTab(e);
});
function focusLine(id) {
  const el = $(`[data-line="${cssq(id)}"]`); if (el) el.scrollIntoView({ block: 'center' });
  const s = $(`[data-product="${cssq(id)}"]`) || (el && el.querySelector('button, input, select')); if (s) s.focus({ preventScroll: true });
}

render();
</script>
</body>
